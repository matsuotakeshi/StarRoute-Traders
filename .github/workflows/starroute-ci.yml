name: FreeBSD Regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starroute-freebsd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: FreeBSD / Python 3.12 / full regression
    if: ${{ github.repository == 'matsuotakeshi/StarRoute-Traders' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'matsuotakeshi' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main')) }}
    runs-on: [self-hosted, Linux, X64, starroute-native]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native verification
        run: python3 ci/native_ci.py --target freebsd --output "$RUNNER_TEMP/starroute-native-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: starroute-native-results
          path: |
            ${{ runner.temp }}/starroute-native-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/starroute-native-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: StarRoute / FreeBSD required
    if: always()
    needs: [native]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, cancelled or unexecuted regression
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
